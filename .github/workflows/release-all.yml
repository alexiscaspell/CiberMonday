name: Release all

# Compila clientes + servidor y publica un GitHub Release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej: 1.0.0, sin la v)'
        required: true
        default: '1.0.0'
      prerelease:
        description: '¿Es una versión pre-release?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ── Clientes ──────────────────────────────────────────────
  android-client:
    name: Android Client APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          chmod +x scripts/build_android_client.sh
          ./scripts/build_android_client.sh
          cp dist/CiberMondayClient.apk "CiberMondayClient-v${{ github.event.inputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-client-apk
          path: CiberMondayClient-v${{ github.event.inputs.version }}.apk
          if-no-files-found: error

  windows-client:
    name: Windows Client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pywin32 pyinstaller
      - name: Build with PyInstaller
        working-directory: ./client/windows
        run: |
          pyinstaller --onefile `
            --name "CiberMondayClient" `
            --hidden-import "client_base" `
            --hidden-import "client_windows" `
            --hidden-import "winreg" `
            --hidden-import "win32serviceutil" `
            --hidden-import "win32service" `
            --hidden-import "win32event" `
            --hidden-import "servicemanager" `
            --hidden-import "win32timezone" `
            --hidden-import "protection" `
            --hidden-import "registry_manager" `
            --hidden-import "config_gui" `
            --hidden-import "tkinter" `
            --hidden-import "tkinter.ttk" `
            --hidden-import "tkinter.messagebox" `
            --hidden-import "requests" `
            --hidden-import "ctypes" `
            --hidden-import "ctypes.wintypes" `
            client.py
          pyinstaller --onefile `
            --name "CiberMondayService" `
            --hidden-import "winreg" `
            --hidden-import "win32serviceutil" `
            --hidden-import "win32service" `
            --hidden-import "win32event" `
            --hidden-import "servicemanager" `
            --hidden-import "win32timezone" `
            --hidden-import "protection" `
            --hidden-import "firewall_manager" `
            --hidden-import "ctypes" `
            --hidden-import "ctypes.wintypes" `
            service.py
          pyinstaller --onefile `
            --name "CiberMondayWatchdog" `
            --hidden-import "winreg" `
            --hidden-import "subprocess" `
            --hidden-import "protection" `
            --hidden-import "ctypes" `
            --hidden-import "ctypes.wintypes" `
            watchdog.py
      - name: Stage files
        shell: cmd
        run: |
          mkdir release-windows
          copy client\windows\dist\CiberMondayClient.exe release-windows\
          copy client\windows\dist\CiberMondayService.exe release-windows\
          copy client\windows\dist\CiberMondayWatchdog.exe release-windows\
          copy client\windows\install_exe_service.bat release-windows\
          copy client\windows\uninstall_exe_service.bat release-windows\
          copy client\windows\show_logs.bat release-windows\
      - uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: release-windows/*
          if-no-files-found: error

  linux-client:
    name: Linux Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          mkdir -p cibermonday-linux
          cp client/linux/client.py client/linux/client_base.py client/linux/client_linux.py \
             client/linux/config_gui.py client/linux/install_linux.sh client/linux/uninstall_linux.sh \
             client/linux/cibermonday-client.service cibermonday-linux/
          chmod +x cibermonday-linux/install_linux.sh cibermonday-linux/uninstall_linux.sh
          tar czf "CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz" cibermonday-linux/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz
          if-no-files-found: error

  # ── Servidor ──────────────────────────────────────────────
  android-server:
    name: Android Server APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          chmod +x scripts/build_android.sh
          ./scripts/build_android.sh
          cp dist/CiberMondayServer.apk "CiberMondayServer-v${{ github.event.inputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-server-apk
          path: CiberMondayServer-v${{ github.event.inputs.version }}.apk
          if-no-files-found: error

  server-web:
    name: Server Web package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t cibermonday-server:release -f docker/Dockerfile.server .
      - name: Package
        run: |
          mkdir -p cibermonday-server
          cp -r server/core server/web requirements.txt docker/docker-compose.yml \
               docker/Dockerfile.server scripts/start_server.sh cibermonday-server/
          chmod +x cibermonday-server/start_server.sh
          tar czf "CiberMondayServer-Web-v${{ github.event.inputs.version }}.tar.gz" cibermonday-server/
      - uses: actions/upload-artifact@v4
        with:
          name: server-web
          path: CiberMondayServer-Web-v${{ github.event.inputs.version }}.tar.gz
          if-no-files-found: error

  # ── Release ───────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android-client
      - windows-client
      - linux-client
      - android-server
      - server-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: List release files
        run: find release-files -type f -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: CiberMonday v${{ github.event.inputs.version }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: |
            release-files/**
          body: |
            # CiberMonday v${{ github.event.inputs.version }}

            ## Servidor
            - `CiberMondayServer-Web-v${{ github.event.inputs.version }}.tar.gz` — Flask + Docker
            - `CiberMondayServer-v${{ github.event.inputs.version }}.apk` — servidor en Android

            ## Clientes
            - `CiberMondayClient-v${{ github.event.inputs.version }}.apk` — cliente Android
            - Windows: `CiberMondayClient.exe`, `CiberMondayService.exe`, `CiberMondayWatchdog.exe` + scripts `.bat`
            - `CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz` — cliente Linux

            ---
            **Commit:** `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
