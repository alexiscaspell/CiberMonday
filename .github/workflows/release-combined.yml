name: Release Combined (Android + Windows + Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del release (ej: 1.0.0)'
        required: true
        default: '1.0.0'
      prerelease:
        description: '¿Es una versión pre-release?'
        required: false
        default: false
        type: boolean

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Grant execute permission for scripts
        run: |
          chmod +x build_android.sh

      - name: Build Android APK
        run: ./build_android.sh

      - name: Verify APK exists
        run: |
          if [ ! -f "dist/CiberMondayServer.apk" ]; then
            echo "Error: APK no encontrado"
            exit 1
          fi
          ls -lh dist/CiberMondayServer.apk

      - name: Create APK filename
        run: echo "APK_FILENAME=CiberMondayServer-v${{ github.event.inputs.version }}.apk" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          cp dist/CiberMondayServer.apk ${{ env.APK_FILENAME }}
          ls -lh ${{ env.APK_FILENAME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_FILENAME }}
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install Flask flask-cors requests pywin32 pyinstaller
      
      - name: Compilar cliente
        working-directory: ./client
        run: |
          pyinstaller --onefile `
            --name "CiberMondayClient" `
            --hidden-import "client_base" `
            --hidden-import "client_windows" `
            --hidden-import "winreg" `
            --hidden-import "win32serviceutil" `
            --hidden-import "win32service" `
            --hidden-import "win32event" `
            --hidden-import "servicemanager" `
            --hidden-import "win32timezone" `
            --hidden-import "protection" `
            --hidden-import "registry_manager" `
            --hidden-import "config_gui" `
            --hidden-import "tkinter" `
            --hidden-import "tkinter.ttk" `
            --hidden-import "tkinter.messagebox" `
            --hidden-import "requests" `
            --hidden-import "ctypes" `
            --hidden-import "ctypes.wintypes" `
            client.py
      
      - name: Compilar servicio
        working-directory: ./client
        run: |
          pyinstaller --onefile `
            --name "CiberMondayService" `
            --hidden-import "winreg" `
            --hidden-import "win32serviceutil" `
            --hidden-import "win32service" `
            --hidden-import "win32event" `
            --hidden-import "servicemanager" `
            --hidden-import "win32timezone" `
            --hidden-import "protection" `
            --hidden-import "firewall_manager" `
            --hidden-import "ctypes" `
            --hidden-import "ctypes.wintypes" `
            service.py
      
      - name: Compilar watchdog
        working-directory: ./client
        run: |
          pyinstaller --onefile `
            --name "CiberMondayWatchdog" `
            --hidden-import "winreg" `
            --hidden-import "subprocess" `
            --hidden-import "protection" `
            --hidden-import "ctypes" `
            --hidden-import "ctypes.wintypes" `
            watchdog.py
      
      - name: Verificar ejecutables generados
        working-directory: ./client/dist
        shell: cmd
        run: |
          dir *.exe
          if not exist CiberMondayClient.exe exit /b 1
          if not exist CiberMondayService.exe exit /b 1
          if not exist CiberMondayWatchdog.exe exit /b 1
      
      - name: Crear directorio temporal para release
        shell: cmd
        run: |
          mkdir release-windows
      
      - name: Copiar archivos a directorio plano
        shell: cmd
        run: |
          copy client\dist\CiberMondayClient.exe release-windows\
          copy client\dist\CiberMondayService.exe release-windows\
          copy client\dist\CiberMondayWatchdog.exe release-windows\
          copy client\install_exe_service.bat release-windows\
          copy client\uninstall_exe_service.bat release-windows\
          copy client\show_logs.bat release-windows\
          dir release-windows\
      
      - name: Verificar archivos copiados
        shell: cmd
        run: |
          if not exist release-windows\CiberMondayClient.exe exit /b 1
          if not exist release-windows\CiberMondayService.exe exit /b 1
          if not exist release-windows\CiberMondayWatchdog.exe exit /b 1
          if not exist release-windows\install_exe_service.bat exit /b 1
          if not exist release-windows\uninstall_exe_service.bat exit /b 1
          if not exist release-windows\show_logs.bat exit /b 1
          echo "Todos los archivos verificados correctamente"
      
      - name: Upload Windows executables artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release-windows/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package Linux client
        run: |
          TARBALL="CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz"
          mkdir -p cibermonday-linux
          cp client/client.py cibermonday-linux/
          cp client/client_base.py cibermonday-linux/
          cp client/client_linux.py cibermonday-linux/
          cp client/config_gui.py cibermonday-linux/
          cp client/install_linux.sh cibermonday-linux/
          cp client/uninstall_linux.sh cibermonday-linux/
          cp client/cibermonday-client.service cibermonday-linux/
          chmod +x cibermonday-linux/install_linux.sh cibermonday-linux/uninstall_linux.sh
          tar czf "$TARBALL" cibermonday-linux/
          ls -lh "$TARBALL"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-client
          path: CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-linux]
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: ./release-files

      - name: Download Windows executables
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./release-files

      - name: Download Linux client
        uses: actions/download-artifact@v4
        with:
          name: linux-client
          path: ./release-files

      - name: List release files
        run: |
          echo "Archivos para la release:"
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: CiberMonday v${{ github.event.inputs.version }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            release-files/*.apk
            release-files/*.exe
            release-files/*.bat
            release-files/*.tar.gz
          body: |
            # CiberMonday v${{ github.event.inputs.version }}
            
            Release completa de CiberMonday: servidor Android, cliente Windows y cliente Linux.
            
            ## Contenido del Release
            
            ### Servidor Android
            - **CiberMondayServer-v${{ github.event.inputs.version }}.apk** - Servidor para Android
            
            ### Cliente Windows
            - **CiberMondayClient.exe** - Cliente principal
            - **CiberMondayService.exe** - Servicio de Windows
            - **CiberMondayWatchdog.exe** - Watchdog independiente
            - **install_exe_service.bat** - Instalador del servicio
            - **uninstall_exe_service.bat** - Desinstalador del servicio
            - **show_logs.bat** - Visor de logs del cliente en tiempo real
            
            ### Cliente Linux
            - **CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz** - Cliente para Linux (scripts Python + instalador systemd)
            
            ---
            
            ## Instalacion del Servidor Android
            
            1. Descarga el archivo `CiberMondayServer-v${{ github.event.inputs.version }}.apk`
            2. Transfiere el APK a tu dispositivo Android
            3. Habilita "Instalar desde fuentes desconocidas" en la configuracion de seguridad
            4. Abre el archivo APK e instalalo
            
            ### Caracteristicas del Servidor Android
            - Servidor HTTP integrado para gestionar clientes
            - Interfaz nativa de Android
            - Gestion de sesiones de tiempo
            - Configuracion de clientes (intervalo de sincronizacion, alertas)
            - Edicion de nombres de clientes
            - Accesible desde otros dispositivos en la misma red WiFi
            
            ### Requisitos del Servidor
            - Android 7.0 (API 24) o superior
            - Conexion WiFi para acceso desde otros dispositivos
            - Permisos de red habilitados
            
            ---
            
            ## Instalacion del Cliente Windows
            
            1. Descarga **todos los archivos** del cliente Windows
            2. Extrae los archivos en una carpeta (ej: `C:\CiberMonday\`)
            3. Ejecuta `install_exe_service.bat` como Administrador
            4. Si es la primera vez, se abrira la ventana de configuracion del servidor
            5. El servicio se instalara, configurara e iniciara automaticamente
            
            ### Protecciones del servicio Windows
            - Inicio automatico con Windows
            - Recuperacion automatica si el servicio falla (reinicio en 5s)
            - Watchdog interno reinicia el cliente si muere (cada 3s)
            - Proteccion DACL contra terminacion del proceso
            - Solo administradores pueden detener el servicio
            
            ### Requisitos del Cliente Windows
            - Windows 10 o superior
            - Permisos de Administrador
            - Conexion de red al servidor
            
            ### Gestion del servicio Windows (requiere Administrador)
            ```bash
            net start CiberMondayClient    # Iniciar
            net stop CiberMondayClient     # Detener
            ```
            
            ### Desinstalacion Windows
            Ejecuta `uninstall_exe_service.bat` como Administrador.
            
            ---
            
            ## Instalacion del Cliente Linux
            
            1. Descarga `CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz`
            2. Extrae: `tar xzf CiberMondayClient-Linux-v${{ github.event.inputs.version }}.tar.gz`
            3. Ejecuta como root: `sudo bash cibermonday-linux/install_linux.sh`
            4. El instalador pedira la URL del servidor y configurara systemd
            
            ### Requisitos del Cliente Linux
            - Python 3.6 o superior
            - systemd
            - Permisos de root para instalar el servicio
            - `requests` (se instala automaticamente)
            
            ### Protecciones del servicio Linux
            - Inicio automatico con systemd
            - Reinicio automatico si falla (cada 5s, max 10 en 60s)
            - ProtectSystem=strict (filesystem de solo lectura)
            
            ### Gestion del servicio Linux
            ```bash
            sudo systemctl start cibermonday-client    # Iniciar
            sudo systemctl stop cibermonday-client     # Detener
            sudo systemctl status cibermonday-client   # Estado
            journalctl -u cibermonday-client -f        # Logs
            ```
            
            ### Desinstalacion Linux
            Ejecuta `sudo bash uninstall_linux.sh`
            
            ---
            
            ## Conexion Cliente-Servidor
            
            ### Configuracion del Servidor Android
            1. Abre la aplicacion en el dispositivo Android
            2. El servidor se iniciara automaticamente en el puerto 5000
            3. La IP del servidor se mostrara en la pantalla principal (ej: `192.168.1.100`)
            
            ### Configuracion del Cliente (Windows o Linux)
            1. Al instalar, se pedira la URL del servidor: `http://[IP_DEL_SERVIDOR]:5000`
            2. Ejemplo: `http://192.168.1.100:5000`
            3. La configuracion se guardara automaticamente
            
            **Nota**: El servidor y los clientes deben estar en la misma red.
            
            ---
            
            ## Notas
            
            - El servidor Android escucha en la IP WiFi del dispositivo
            - Los clientes funcionan sin conexion continua gracias al almacenamiento local
            - Sincroniza con el servidor cada 30 segundos (configurable)
            - Bloquea automaticamente el equipo cuando expira el tiempo asignado
            
            ---
            
            **Compilado el:** ${{ github.event.head_commit.timestamp || github.run_started_at }}  
            **Commit:** ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
